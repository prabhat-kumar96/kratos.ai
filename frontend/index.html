<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>krotos.ai</title>
  </head>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      // Ignore Google Translate / extension DOM manipulation errors
      if (msg && msg.includes && (msg.includes("removeChild") || msg.includes("insertBefore"))) {
        return true;
      }
      console.error("Global Error Caught:", msg, url, line, col, error);
      return false;
    };
    window.addEventListener('unhandledrejection', function (event) {
      console.warn("Unhandled Promise Rejection:", event.reason);
    });
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
